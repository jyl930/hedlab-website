<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Human & Environment Design Lab</title>

  <!-- Urbanist (영문) + Noto Sans KR (국문) -->
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== Tokens ===== */
    :root{
      --fg:#0a0a0a;
      --muted:#9a9a9a;
      --ring:#f0f0f0;
      --pill-bg:#fff;
      --shadow:0 12px 40px rgba(0,0,0,.08);
      --hero-pill-max:1100px;
    }

    /* ===== Base ===== */
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; background:#fff; color:var(--fg);
      font-family:"Urbanist","Noto Sans KR",system-ui,Segoe UI,Roboto,Apple Color Emoji,Segoe UI Emoji,sans-serif;
      line-height:1.45; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }

    /* ===== Hero video ===== */
    .hero-video-wrap{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .hero-video{ width:100%; height:100%; object-fit:cover; opacity:.12; filter:saturate(90%) contrast(100%); }
    .hero-fallback{ position:absolute; inset:0; background:linear-gradient(180deg,#fff 0,#fff 40%,#fafafa 100%); opacity:.6; }

    /* ===== Layout ===== */
    .page{ position:relative; z-index:1; min-height:100dvh; display:grid; grid-template-rows:auto 1fr; }
    header{ display:flex; justify-content:center; padding:24px 16px 8px; }
    .lab-name{ font-weight:800; letter-spacing:.3px; font-size:18px; opacity:.9; }

    main.home{ display:flex; flex-direction:column; align-items:center; gap:32px; padding:24px 16px 56px; }

    /* ===== Search pill (typing bar) ===== */
    .search-pill{
      width:min(96vw,var(--hero-pill-max)); min-height:56px;
      padding:12px 16px; border-radius:999px; background:var(--pill-bg);
      border:1px solid var(--ring); box-shadow:var(--shadow);
      display:flex; align-items:flex-start; gap:10px;
    }
    .icon{ flex:0 0 auto; width:24px; height:24px; display:grid; place-items:center; opacity:.6; margin-top:2px; }
    .type-area{ position:relative; flex:1; min-width:0; color:#4a4a4a; font-size:14px; line-height:1.4; }

    /* 줄바꿈 허용 + 커서를 가상요소로 */
    .type-line{ white-space:normal; overflow-wrap:anywhere; word-break:normal; }
    .type-line::after{
      content:""; display:inline-block; width:0;
      border-left:1.5px solid #6b6b6b; height:1.1em; vertical-align:-2px;
      animation:blink .9s step-end infinite;
    }
    .cursor{ display:none !important; } /* 기존 span 커서는 숨김 */
    @keyframes blink{ 50%{opacity:0} }

    /* 비디오 타자(선택형) */
    .typing-video{ display:none; width:100%; height:28px; object-fit:contain; }
    .type-area.video-on .typing-video{ display:block; }
    .type-area.video-on .type-line{ display:none; }

    /* ===== Menu ===== */
    .menu{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px; }
    .menu a{
      font-weight:700; letter-spacing:.6px; color:#bdbdbd; text-decoration:none;
      font-size:clamp(18px,6vw,28px); transition:color .2s, transform .2s;
    }
    .menu a:hover{ color:#111; transform:translateY(-1px); }

    /* ===== Motion reduce ===== */
    @media (prefers-reduced-motion:reduce){
      .type-line::after{ animation:none; }
      .hero-video{ animation:none; }
    }

    /* ===== Responsive polish ===== */
    @media (min-width:600px){
      main.home{ gap:40px; padding:32px 20px 72px; }
      .search-pill{ min-height:64px; padding:14px 20px; }
      .icon{ width:26px; height:26px; }
      .type-area{ font-size:15px; }
      .menu a{ font-size:clamp(22px,4vw,32px); }
    }
    @media (min-width:1024px){
      .type-area{ font-size:16px; }
      .menu a{ font-size:clamp(24px,3vw,36px); }
    }
  </style>
</head>
<body>
  <!-- Background hero video -->
  <div class="hero-video-wrap" aria-hidden="true">
    <video class="hero-video" id="heroVideo" src="assets/hero.mp4" muted playsinline loop preload="metadata" poster="assets/hero_poster.jpg"></video>
    <div class="hero-fallback"></div>
  </div>

  <div class="page">
    <header>
      <div class="lab-name">Human &amp; Environment Design Lab</div>
    </header>

    <main class="home">
      <!-- Typing pill -->
      <div class="search-pill" role="region" aria-label="Lab mission statement typed">
        <div class="icon" aria-hidden="true">
          <!-- line icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="11" cy="11" r="7.25" stroke="#3c3c3c" stroke-width="1.5"/>
            <path d="M16.8 16.8L21 21" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="type-area" id="typeArea">
          <!-- text typing -->
          <span class="type-line" id="typeLine"></span><span class="cursor" aria-hidden="true"></span>
          <!-- video typing (optional) -->
          <video class="typing-video" id="typingVideo" src="assets/typing.mp4" muted playsinline preload="metadata"></video>
        </div>
      </div>

      <!-- Main menu -->
      <nav class="menu" aria-label="Primary">
        <a href="member.html">MEMBER</a>
        <a href="publications.html">PUBLICATIONS</a>
        <a href="activities.html">ACTIVITIES</a>
        <a href="achievements.html">ACHIEVEMENTS</a>
        <a href="contact.html">CONTACT</a>
      </nav>
    </main>
  </div>

  <script>
    // ===== Options =====
    const USE_TYPING_VIDEO = false; // true: use assets/typing.mp4
    const TYPING_TEXT = "we research sustainable spaces, exploring new spatial paradigms for human-environment coexistence.";
    const TYPE_SPEED = 38; // ms/char
    const START_DELAY = 550; // ms

    // Hero video autoplay (mobile-friendly)
    const hero = document.getElementById('heroVideo');
    if(hero){
      const tryPlay = () => hero.play().catch(()=>{});
      document.addEventListener('visibilitychange', tryPlay, { once:true });
      window.addEventListener('load', tryPlay, { once:true });
    }

    // Typing setup
    const typeArea = document.getElementById('typeArea');
    const typeLine = document.getElementById('typeLine');
    const typingVideo = document.getElementById('typingVideo');

    if(USE_TYPING_VIDEO){
      typeArea.classList.add('video-on');
      typingVideo && typingVideo.addEventListener('canplay', ()=> typingVideo.play().catch(()=>{}));
    }else{
      let i = 0;
      typeLine.textContent = '';
      setTimeout(function tick(){
        if(i <= TYPING_TEXT.length){
          typeLine.textContent = TYPING_TEXT.slice(0, i++);
          setTimeout(tick, TYPE_SPEED);
        }
      }, START_DELAY);
    }
  </script>

  <footer class="site-footer">
    <p>© 2025 Human & Environment Design Lab. All rights reserved.</p>
  </footer>
</body>
</html>
